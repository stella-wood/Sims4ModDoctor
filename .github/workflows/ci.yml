name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore locked dependencies
        run: dotnet restore Sims4ModDoctor.sln --locked-mode

      - name: Build Release
        run: dotnet build Sims4ModDoctor.sln -c Release --no-restore --nologo

      - name: Run tests
        run: dotnet test Sims4ModDoctor.sln -c Release --no-build --no-restore --nologo
